services:
  # 1. THE DATABASE WAREHOUSE
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: beza
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: helpdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # We remove ports: 5432:5432 to keep the DB hidden from the public internet
  redis:
    image: redis:alpine
    restart: always
  # 2. THE APP CLUSTER (3 REPLICAS)
  helpdesk-app-1:
    build: .
    environment:
      DATABASE_URL: "postgresql://beza:password123@db:5432/helpdesk?schema=public"
      REDIS_URL: "redis://redis:6379"
      AUTH_SECRET: "your_secret_here"
    depends_on:
      - db

  helpdesk-app-2:
    build: .
    environment:
      DATABASE_URL: "postgresql://beza:password123@db:5432/helpdesk?schema=public"
      REDIS_URL: "redis://redis:6379"
      AUTH_SECRET: "your_secret_here"
    depends_on:
      - db

  helpdesk-app-3:
    build: .
    environment:
      DATABASE_URL: "postgresql://beza:password123@db:5432/helpdesk?schema=public"
      REDIS_URL: "redis://redis:6379"
      AUTH_SECRET: "your_secret_here"
    depends_on:
      - db

  # 3. THE LOAD BALANCER (NGINX)
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Map our custom config
    ports:
      - "80:80" # PUBLIC GATEWAY
    depends_on:
      - helpdesk-app-1
      - helpdesk-app-2
      - helpdesk-app-3

volumes:
  postgres_data: